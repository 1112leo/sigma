<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>시그마 | 천안오성고 수학동아리</title>
  <meta name="description" content="천안오성고등학교 수학동아리 시그마의 활동을 소개합니다." />
  <link rel="icon" href="goldenbell/run/favicon.svg" type="image/svg+xml">
  <link rel="preload" as="font" href="goldenbell/fonts/DNFBitBit-Regular.woff2" type="font/woff2" crossorigin>
  <style>
    * {
      box-sizing: border-box;
    }

    @font-face {
      font-family: 'bitbit';
      src: url('goldenbell/fonts/DNFBitBit-Regular.woff2') format('woff2');
      font-weight: 400 900;
      font-style: normal;
      font-display: swap;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f7f8fa;
      color: #172033;
      font-family: "bitbit", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      font-size: 16px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-synthesis: none;
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    .container {
      width: min(980px, calc(100% - 40px));
      margin: 0 auto;
    }

    header {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e3e7ed;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      color: inherit;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-decoration: none;
    }

    .logo-mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 11px;
      background: #172033;
      color: #ffffff;
      font: 21px Georgia, serif;
      letter-spacing: 0;
    }

    .school {
      color: #667186;
      font-size: 14px;
    }

    main {
      min-height: calc(100svh - 136px);
      padding: 82px 0 90px;
    }

    .intro {
      max-width: 720px;
    }

    .eyebrow {
      margin: 0 0 18px;
      color: #56617a;
      font-size: 14px;
    }

    h1,
    h2,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 0;
      font-size: clamp(64px, 9vw, 88px);
      line-height: 1.1;
      letter-spacing: -0.03em;
    }

    .description {
      max-width: 34em;
      margin: 20px 0 0;
      color: #46536b;
      font-size: 18px;
      line-height: 1.7;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 62px 0 17px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 23px;
      line-height: 1.3;
    }

    .section-heading span {
      color: #738095;
      font-size: 14px;
    }

    .projects {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 18px;
    }

    .project-card {
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding: 16px;
      border: 1px solid #e3e7ed;
      border-radius: 20px;
      background: #fff;
      color: #172033;
      text-decoration: none;
      transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
    }

    .project-card:hover {
      transform: translateY(-3px);
      border-color: #c8d0dc;
      box-shadow: 0 12px 28px rgba(23, 32, 51, 0.07);
    }

    .project-art {
      display: grid;
      place-items: center;
      height: 155px;
      overflow: hidden;
      border-radius: 13px;
    }

    .binary-art {
      background: #e9eefc;
      color: #3159c3;
      font-size: clamp(48px, 6vw, 72px);
      letter-spacing: 0.06em;
    }

    .bell-art {
      background: #1d2a41;
    }

    .bell-art img {
      width: 190px;
      height: 190px;
      object-fit: contain;
      mix-blend-mode: screen;
      -webkit-mask-image: radial-gradient(circle, #000 44%, transparent 73%);
      mask-image: radial-gradient(circle, #000 44%, transparent 73%);
    }

    .project-copy {
      flex: 1;
      padding: 22px 9px 14px;
    }

    .project-label {
      margin-bottom: 8px;
      color: #667186;
      font-size: 13px;
    }

    .project-copy h3 {
      margin: 0 0 8px;
      font-size: 24px;
      line-height: 1.3;
    }

    .project-copy > p:last-child {
      margin-bottom: 0;
      color: #56617a;
      font-size: 15px;
    }

    .project-arrow {
      align-self: flex-end;
      padding: 0 9px 7px;
      color: #3159c3;
      font-size: 22px;
    }

    a:focus-visible {
      outline: 3px solid #3568ed;
      outline-offset: 4px;
    }

    footer {
      display: flex;
      align-items: center;
      min-height: 60px;
      padding: 12px 0;
      border-top: 1px solid #e3e7ed;
      color: #56617a;
      font-size: 13px;
    }

    @media (max-width: 640px) {
      .container {
        width: min(100% - 28px, 980px);
      }

      header {
        height: 68px;
      }

      .school {
        display: none;
      }

      main {
        min-height: calc(100svh - 128px);
        padding: 58px 0 64px;
      }

      .intro .eyebrow {
        margin-bottom: 12px;
      }

      h1 {
        font-size: 66px;
      }

      .description {
        margin-top: 15px;
        font-size: 17px;
      }

      .section-heading {
        margin-top: 48px;
      }

      .projects {
        grid-template-columns: 1fr;
      }

      .project-art {
        height: 145px;
      }
    }

    @media (max-width: 370px) {
      .logo {
        font-size: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }

      .project-card:hover {
        transform: none;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <a class="logo" href="/" aria-label="시그마 메인으로"><span class="logo-mark" aria-hidden="true">Σ</span><span>시그마</span></a>
      <span class="school">천안오성고등학교 수학동아리</span>
    </header>

    <main id="main">
      <section class="intro" aria-labelledby="home-title">
        <p class="eyebrow">천안오성고등학교 수학동아리</p>
        <h1 id="home-title">시그마</h1>
        <p class="description">수학을 직접 체험하고, 함께 문제를 풀어 봅니다.</p>
      </section>

      <section aria-labelledby="projects-title">
        <div class="section-heading">
          <h2 id="projects-title">활동</h2>
          <span>2026</span>
        </div>
        <div class="projects">
          <a class="project-card" href="/binary/" aria-label="이진법 카드 체험 자세히 보기">
            <div class="project-art binary-art" aria-hidden="true">0101</div>
            <div class="project-copy">
              <p class="project-label">1학기 동아리 발표회</p>
              <h3>이진법 카드 체험</h3>
              <p>카드를 이용해 숫자를 이진법으로 표현해 봅니다.</p>
            </div>
            <span class="project-arrow" aria-hidden="true">↗</span>
          </a>
          <a class="project-card" href="/goldenbell/" aria-label="수학 골든벨 자세히 보기">
            <div class="project-art bell-art" aria-hidden="true"><img src="goldenbell/hero-bell.png" width="1254" height="1254" alt="" loading="lazy"></div>
            <div class="project-copy">
              <p class="project-label">2026. 10. 30. · 수학 퀴즈 행사</p>
              <h3>수학 골든벨</h3>
              <p>함께 문제를 풀고 골든벨에 도전합니다.</p>
            </div>
            <span class="project-arrow" aria-hidden="true">↗</span>
          </a>
        </div>
      </section>
    </main>

    <footer>
      © 2026 시그마 · 천안오성고등학교 수학동아리
    </footer>
  </div>
</body>

</html>
