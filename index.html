<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIGMA | 천안오성고 수학동아리</title>
  <meta name="description" content="천안오성고등학교 수학동아리 SIGMA" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #ffffff;
      color: #111111;
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans KR", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: min(920px, calc(100% - 40px));
      margin: 0 auto;
    }

    header {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #eeeeee;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .logo-mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 11px;
      background: #3568ed;
      color: #ffffff;
      font-family: Georgia, serif;
      font-size: 21px;
      letter-spacing: 0;
    }

    .school {
      font-size: 13px;
      color: #777777;
    }

    main {
      min-height: calc(100vh - 132px);
      display: flex;
      align-items: center;
      padding: 72px 0;
    }

    .hero {
      width: 100%;
    }

    h1 {
      margin: 0;
      font-size: clamp(52px, 10vw, 88px);
      line-height: 1;
      letter-spacing: -0.05em;
      font-weight: 800;
      color: #172033;
    }

    .description {
      margin: 24px 0 0;
      font-size: 17px;
      line-height: 1.7;
      color: #666666;
      word-break: keep-all;
    }

    .links {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-top: 44px;
    }

    .link-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 110px;
      padding: 0 24px;
      border: 1px solid #dddddd;
      border-radius: 14px;
      color: #111111;
      text-decoration: none;
      transition: 0.18s ease;
      background: #ffffff;
    }

    .link-card:hover {
      border-color: #3568ed;
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(53, 104, 237, 0.08);
    }

    .link-title {
      font-size: 19px;
      font-weight: 700;
    }

    .link-subtitle {
      margin-top: 5px;
      font-size: 13px;
      color: #888888;
    }

    .arrow {
      font-size: 22px;
      color: #3568ed;
    }

    footer {
      height: 60px;
      display: flex;
      align-items: center;
      border-top: 1px solid #eeeeee;
      color: #999999;
      font-size: 12px;
    }

    @media (max-width: 640px) {
      .container {
        width: min(100% - 28px, 920px);
      }

      header {
        height: 64px;
      }

      .school {
        display: none;
      }

      main {
        min-height: calc(100vh - 120px);
        padding: 48px 0;
      }

      .links {
        grid-template-columns: 1fr;
      }

      .link-card {
        min-height: 96px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <div class="logo"><span class="logo-mark">Σ</span><span>시그마</span></div>
      <div class="school">천안오성고등학교 수학동아리</div>
    </header>

    <main>
      <section class="hero">
        <h1>시그마</h1>

        <p class="description">
          천안오성고등학교 수학동아리 시그마<br />
        </p>

        <div class="links">
          <a href="/binary/" class="link-card">
            <div>
              <div class="link-title">1학기 동아리 발표회</div>
              <div class="link-subtitle">2진법 체험</div>
            </div>
            <div class="arrow">→</div>
          </a>

          <a href="/goldenbell/" class="link-card">
            <div>
              <div class="link-title">수학 골든벨</div>
              <div class="link-subtitle">수학 퀴즈 행사</div>
            </div>
            <div class="arrow">→</div>
          </a>
        </div>
      </section>
    </main>

    <footer>
      © 2026 시그마
    </footer>
  </div>
</body>

</html>
