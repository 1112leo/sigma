<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>시그마 | 천안오성고 수학동아리</title>
  <meta name="description" content="천안오성고등학교 수학동아리 시그마" />
  <link rel="preload" as="font" href="goldenbell/fonts/DNFBitBit-Regular.woff2" type="font/woff2" crossorigin>
  <style>
    * {
      box-sizing: border-box;
    }

    @font-face {
      font-family: 'bitbit';
      src: url('goldenbell/fonts/DNFBitBit-Regular.woff2') format('woff2');
      font-weight: 400 900;
      font-style: normal;
      font-display: swap;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f6fa;
      color: #172033;
      font-family: "bitbit", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      font-size: 16px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-synthesis: none;
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    .container {
      width: min(1080px, calc(100% - 36px));
      margin: 0 auto;
    }

    header {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #dfe4ee;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .logo-mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 11px;
      background: #172033;
      color: #ffffff;
      font: 21px Georgia, serif;
      letter-spacing: 0;
    }

    .school {
      font-size: 13px;
      color: #56617a;
      font-size: 14px;
    }

    main {
      min-height: calc(100svh - 136px);
      display: flex;
      align-items: center;
      padding: 64px 0 76px;
    }

    .hero {
      width: 100%;
    }

    h1 {
      margin: 0;
      font-size: clamp(60px, 9vw, 94px);
      line-height: 1;
      letter-spacing: -0.03em;
      font-weight: 800;
      color: #172033;
    }

    .description {
      max-width: 38em;
      margin: 20px 0 0;
      font-size: 19px;
      line-height: 1.8;
      color: #46536b;
      word-break: keep-all;
    }

    .links {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-top: 36px;
    }

    .link-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 128px;
      padding: 22px 26px;
      border: 1px solid #dfe4ee;
      border-radius: 18px;
      color: #172033;
      text-decoration: none;
      transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(23, 32, 51, 0.04);
    }

    .link-card:hover {
      border-color: #3568ed;
      transform: translateY(-3px);
      box-shadow: 0 16px 32px rgba(23, 32, 51, 0.09);
    }

    .link-card:focus-visible {
      outline: 3px solid rgba(53, 104, 237, 0.38);
      outline-offset: 3px;
    }

    .link-title {
      font-size: 20px;
      font-weight: 700;
    }

    .link-subtitle {
      margin-top: 5px;
      font-size: 14px;
      color: #56617a;
    }

    .arrow {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #eef2ff;
      font-size: 22px;
      color: #3568ed;
    }

    .link-card:nth-child(2) .arrow {
      background: #fff3c4;
      color: #9a7310;
    }

    footer {
      height: 60px;
      display: flex;
      align-items: center;
      border-top: 1px solid #dfe4ee;
      color: #56617a;
      font-size: 13px;
    }

    @media (max-width: 640px) {
      .container {
        width: min(100% - 28px, 1080px);
      }

      header {
        height: 68px;
      }

      .school {
        display: none;
      }

      main {
        min-height: calc(100svh - 128px);
        padding: 44px 0 56px;
      }

      .links {
        grid-template-columns: 1fr;
      }

      .link-card {
        min-height: 108px;
        padding: 18px 20px;
      }

      .description {
        font-size: 17px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }

      .link-card:hover {
        transform: none;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <div class="logo"><span class="logo-mark">Σ</span><span>시그마</span></div>
      <div class="school">천안오성고등학교 수학동아리</div>
    </header>

    <main>
      <section class="hero">
        <h1>시그마</h1>

        <p class="description">수학을 직접 체험하고, 함께 도전하는 시그마의 활동을 소개합니다.</p>

        <div class="links">
          <a href="/binary/" class="link-card">
            <div>
              <div class="link-title">1학기 동아리 발표회</div>
              <div class="link-subtitle">카드로 만나는 2진법</div>
            </div>
            <div class="arrow">→</div>
          </a>

          <a href="/goldenbell/" class="link-card">
            <div>
              <div class="link-title">수학 골든벨</div>
              <div class="link-subtitle">10월 30일 · 참가 신청</div>
            </div>
            <div class="arrow">→</div>
          </a>
        </div>
      </section>
    </main>

    <footer>
      © 2026 시그마 · 천안오성고등학교 수학동아리
    </footer>
  </div>
</body>

</html>
